<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নতুন শিক্ষক সংযোজন ফরম</title>
    <style>
        @import url('https://fonts.maateen.me/kalpurush/font.css');

        * {
            box-sizing: border-box;
            font-family: 'Kalpurush', sans-serif !important;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            margin: 0;
        }

        .form-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .form-header {
            font-size: 16px;
            color: #555;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tooltip-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 16px;
            height: 16px;
            background-color: #333;
            color: #fff;
            border-radius: 50%;
            font-size: 11px;
            font-weight: bold;
            font-family: Arial, sans-serif !important;
        }

        .english-input {
            font-family: Arial, sans-serif !important;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdcdc;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-size: 14px;
            height: 42px;
            color: #333;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #bbb;
            background-color: #fff;
        }

        .date-toggle-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .date-toggle-group input {
            flex: 1;
        }

        .na-checkbox-label {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            font-weight: normal;
            cursor: pointer;
            white-space: nowrap;
            color: #555;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .print-btn {
            padding: 10px 30px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            background-color: #2980b9;
            color: white;
        }

        .print-btn:hover {
            background-color: #1f618d;
        }

        /* Print Styles matching EXACT visual alignment */
        @page {
            size: A4 portrait;
            margin: 12mm 15mm;
        }

        @media print {
            body {
                background-color: #fff !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .form-container {
                box-shadow: none !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                background: transparent !important;
            }

            .form-header {
                font-size: 15px !important;
                margin-bottom: 22px !important;
                color: #555 !important;
            }

            .form-grid {
                display: grid !important;
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 16px 20px !important;
            }

            label {
                font-size: 13px !important;
                font-weight: bold !important;
                margin-bottom: 6px !important;
                color: #111 !important;
            }

            input[type="text"],
            input[type="number"],
            input[type="date"],
            select {
                padding: 6px 12px !important;
                font-size: 13px !important;
                height: 40px !important;
                border: 1px solid #e2e8f0 !important;
                background-color: #f7f9fc !important;
                border-radius: 4px !important;
                color: #333 !important;
                -webkit-appearance: none !important;
                -moz-appearance: none !important;
                appearance: none !important;
            }

            input[type="date"]::-webkit-calendar-picker-indicator {
                display: none !important;
            }

            .na-checkbox-label, .btn-group {
                display: none !important;
            }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">নতুন শিক্ষক সংযোজন ফরম</div>
    
    <form id="teacherForm">
        <div class="form-grid">
            
            <!-- Row 1 -->
            <div class="form-group">
                <label for="pin">শিক্ষক পিন</label>
                <input type="text" id="pin" name="pin" class="english-input" value="9131703010296">
            </div>

            <div class="form-group">
                <label for="school_name">বিদ্যালয়ের নাম</label>
                <input type="text" id="school_name" name="school_name" value="বাজুনিয়া সরকারি প্রাথমিক বিদ্যালয় 91317031404">
            </div>

            <div class="form-group">
                <label for="name_bn">নাম (বাংলায়)</label>
                <input type="text" id="name_bn" name="name_bn" value="শেখ নাজমুল">
            </div>

            <!-- Row 2 -->
            <div class="form-group">
                <label for="designation">পদবি</label>
                <select id="designation" name="designation">
                    <option value="সহকারী শিক্ষক" selected>সহকারী শিক্ষক</option>
                    <option value="প্রধান শিক্ষক">প্রধান শিক্ষক</option>
                </select>
            </div>

            <div class="form-group">
                <label for="recruitment_type">নিয়োগের ধরন</label>
                <select id="recruitment_type" name="recruitment_type">
                    <option value="রাজস্ব" selected>রাজস্ব</option>
                    <option value="অন্যান্য">অন্যান্য</option>
                </select>
            </div>

            <div class="form-group">
                <label for="circular_date">উন্মুক্ত বিজ্ঞপ্তির তারিখ</label>
                <input type="date" id="circular_date" name="circular_date">
            </div>

            <!-- Row 3 -->
            <div class="form-group">
                <label for="list_type">মূল/অপেক্ষমাণ তালিকা</label>
                <select id="list_type" name="list_type">
                    <option value="প্রযোজ্য নয়" selected>প্রযোজ্য নয়</option>
                    <option value="মূল তালিকা">মূল তালিকা</option>
                    <option value="অপেক্ষমাণ তালিকা">অপেক্ষমাণ তালিকা</option>
                </select>
            </div>

            <div class="form-group">
                <label for="order_date">নিয়োগ আদেশের তারিখ</label>
                <input type="date" id="order_date" name="order_date">
            </div>

            <div class="form-group">
                <label for="regular_date">নিয়মিতকরণের তারিখ</label>
                <div class="date-toggle-group">
                    <input type="date" id="regular_date" name="regular_date">
                    <label class="na-checkbox-label">
                        <input type="checkbox" onchange="toggleDateInput('regular_date', this)"> N/A
                    </label>
                </div>
            </div>

            <!-- Row 4 -->
            <div class="form-group">
                <label for="panel_date">আত্মীকরণের তারিখ/প্যানেল নিয়োগ আদেশের তারিখ</label>
                <div class="date-toggle-group">
                    <input type="date" id="panel_date" name="panel_date">
                    <label class="na-checkbox-label">
                        <input type="checkbox" onchange="toggleDateInput('panel_date', this)"> N/A
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="revenue_join_date">রাজস্ব পদে যোগদানের তারিখ</label>
                <input type="date" id="revenue_join_date" name="revenue_join_date">
            </div>

            <div class="form-group">
                <label for="permanent_date">চাকরি স্থায়ীকরণের তারিখ</label>
                <input type="date" id="permanent_date" name="permanent_date">
            </div>

            <!-- Row 5 -->
            <div class="form-group">
                <label for="merit_position">মেধাক্রম (প্রযোজ্য ক্ষেত্রে)</label>
                <input type="text" id="merit_position" name="merit_position">
            </div>

            <div class="form-group">
                <label for="dob">জন্ম তারিখ</label>
                <input type="date" id="dob" name="dob">
            </div>

            <div class="form-group">
                <label for="eft_mobile">EFT তে প্রদত্ত মোবাইল নম্বর</label>
                <input type="text" id="eft_mobile" name="eft_mobile" class="english-input">
            </div>

            <!-- Row 6 -->
            <div class="form-group">
                <label for="edu_qualification">সর্বোচ্চ শিক্ষাগত যোগ্যতা</label>
                <select id="edu_qualification" name="edu_qualification">
                    <option value="" disabled selected>বাছাই করুন</option>
                    <option value="এসএসসি">এসএসসি</option>
                    <option value="এইচএসসি">এইচএসসি</option>
                    <option value="স্নাতক">স্নাতক</option>
                    <option value="স্নাতকোত্তর">স্নাতকোত্তর</option>
                </select>
            </div>

            <div class="form-group">
                <label for="edu_date">
                    সর্বোচ্চ শিক্ষাগত যোগ্যতা অর্জনের তারিখ
                    <span class="tooltip-icon">?</span>
                </label>
                <input type="date" id="edu_date" name="edu_date">
            </div>

            <div class="form-group">
                <label for="professional_passing_year">
                    সিইনএড/ডিপিএড/বিএড পাশের সাল
                    <span class="tooltip-icon">?</span>
                </label>
                <input type="number" id="professional_passing_year" name="professional_passing_year" class="english-input">
            </div>

            <!-- Row 7 -->
            <div class="form-group">
                <label for="other_upazila">
                    অন্য উপজেলা/থানা হতে আগত শিক্ষক কি না?
                    <span class="tooltip-icon">?</span>
                </label>
                <select id="other_upazila" name="other_upazila">
                    <option value="" disabled selected>বাছাই করুন</option>
                    <option value="না">না</option>
                    <option value="হ্যাঁ">হ্যাঁ</option>
                </select>
            </div>

            <div class="form-group">
                <label for="app_district">নিয়োগ আবেদনের জেলা</label>
                <select id="app_district" name="app_district" onchange="updateUpazila()">
                    <option value="" disabled selected>* জেলা বাছাই করুন</option>
                </select>
            </div>

            <div class="form-group">
                <label for="app_upazila">নিয়োগ আবেদনের উপজেলা/থানা</label>
                <select id="app_upazila" name="app_upazila">
                    <option value="" disabled selected>* উপজেলা/থানা বাছাই করুন</option>
                </select>
            </div>

            <!-- Row 8 -->
            <div class="form-group">
                <label for="upazila_join_date">অত্র উপজেলা/থানায় যোগদানের তারিখ</label>
                <input type="date" id="upazila_join_date" name="upazila_join_date">
            </div>

            <div class="form-group">
                <label for="acting_headmaster">প্রধান শিক্ষক (চলতি দায়িত্ব) প্রাপ্ত কি না?</label>
                <select id="acting_headmaster" name="acting_headmaster">
                    <option value="" disabled selected>বাছাই করুন</option>
                    <option value="না">না</option>
                    <option value="হ্যাঁ">হ্যাঁ</option>
                </select>
            </div>

        </div>

        <div class="btn-group">
            <button type="button" class="print-btn" onclick="window.print()">প্রিন্ট করুন</button>
        </div>
    </form>
</div>

<script>
    const districtUpazilaData = {
        "গোপালগঞ্জ": ["গোপালগঞ্জ সদর", "কাশিয়ানী", "কোটালীপাড়া", "মুকসুদপুর", "টুঙ্গিপাড়া"]
    };

    window.onload = function() {
        const districtSelect = document.getElementById("app_district");
        for (let district in districtUpazilaData) {
            let opt = document.createElement("option");
            opt.value = district;
            opt.innerHTML = district;
            districtSelect.appendChild(opt);
        }
    };

    function updateUpazila() {
        const districtSelect = document.getElementById("app_district");
        const upazilaSelect = document.getElementById("app_upazila");
        const selectedDistrict = districtSelect.value;

        upazilaSelect.innerHTML = '<option value="" disabled selected>* উপজেলা/থানা বাছাই করুন</option>';

        if (selectedDistrict && districtUpazilaData[selectedDistrict]) {
            districtUpazilaData[selectedDistrict].forEach(function(upazila) {
                let opt = document.createElement("option");
                opt.value = upazila;
                opt.innerHTML = upazila;
                upazilaSelect.appendChild(opt);
            });
        }
    }

    function toggleDateInput(fieldId, checkbox) {
        const inputField = document.getElementById(fieldId);
        if (checkbox.checked) {
            inputField.type = "text";
            inputField.value = "প্রযোজ্য নয়";
            inputField.readOnly = true;
        } else {
            inputField.type = "date";
            inputField.value = "";
            inputField.readOnly = false;
        }
    }
</script>

</body>
</html>

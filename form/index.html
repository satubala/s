<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নতুন শিক্ষক সংযোজন ফরম</title>
    <style>
        @import url('https://fonts.maateen.me/kalpurush/font.css');

        * {
            box-sizing: border-box;
            font-family: 'Kalpurush', sans-serif !important;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            margin: 0;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 6px;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: bold;
            margin-bottom: 2px;
            color: #333;
            font-size: 13px;
        }

        .english-input {
            font-family: Arial, sans-serif !important;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            height: 32px;
        }

        .date-toggle-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .date-toggle-group input[type="date"],
        .date-toggle-group input[type="text"] {
            flex: 1;
        }

        .na-checkbox-label {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            font-weight: normal;
            cursor: pointer;
            white-space: nowrap;
        }

        .na-checkbox-label input {
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .submit-btn, .print-btn {
            flex: 1;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
        }

        .submit-btn {
            background-color: #27ae60;
            color: white;
        }

        .submit-btn:hover {
            background-color: #219150;
        }

        .print-btn {
            background-color: #2980b9;
            color: white;
        }

        .print-btn:hover {
            background-color: #1f618d;
        }

        /* --- A4 1-Page Print Settings --- */
        @page {
            size: A4 portrait;
            margin: 10mm 12mm;
        }

        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }
            .form-container {
                box-shadow: none;
                padding: 0;
                width: 100%;
                max-width: 100%;
            }
            h2 {
                font-size: 18px;
                margin-bottom: 10px;
                padding-bottom: 4px;
            }
            .form-grid {
                gap: 5px 12px;
            }
            label {
                font-size: 11px;
                margin-bottom: 1px;
            }
            input[type="text"],
            input[type="number"],
            input[type="date"],
            select {
                padding: 2px 5px;
                font-size: 11px;
                height: 24px;
                border: 1px solid #666;
            }
            .na-checkbox-label {
                display: none !important; /* Hide checkbox control in print mode */
            }
            .btn-group {
                display: none !important;
            }
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>নতুন শিক্ষক সংযোজন ফরম</h2>
    <form action="#" method="POST">
        <div class="form-grid">
            
            <div class="form-group">
                <label for="pin">শিক্ষক পিন (English)</label>
                <input type="text" id="pin" name="pin" class="english-input" placeholder="e.g. 1002345" pattern="[0-9]*" inputmode="numeric">
            </div>

            <div class="form-group">
                <label for="school_name">বিদ্যালয়ের নাম</label>
                <input type="text" id="school_name" name="school_name">
            </div>

            <div class="form-group">
                <label for="name_bn">নাম (বাংলায়)</label>
                <input type="text" id="name_bn" name="name_bn">
            </div>

            <div class="form-group">
                <label for="designation">পদবি</label>
                <select id="designation" name="designation">
                    <option value="সহকারী শিক্ষক" selected>সহকারী শিক্ষক</option>
                    <option value="প্রধান শিক্ষক">প্রধান শিক্ষক</option>
                </select>
            </div>

            <div class="form-group">
                <label for="recruitment_type">নিয়োগের ধরন</label>
                <select id="recruitment_type" name="recruitment_type">
                    <option value="রাজস্ব" selected>রাজস্ব</option>
                    <option value="অন্যান্য">অন্যান্য</option>
                </select>
            </div>

            <div class="form-group">
                <label for="circular_date">উন্মুক্ত বিজ্ঞপ্তির তারিখ</label>
                <input type="date" id="circular_date" name="circular_date">
            </div>

            <div class="form-group">
                <label for="list_type">মূল/অপেক্ষমাণ তালিকা</label>
                <select id="list_type" name="list_type">
                    <option value="প্রযোজ্য নয়" selected>প্রযোজ্য নয়</option>
                    <option value="মূল তালিকা">মূল তালিকা</option>
                    <option value="অপেক্ষমাণ তালিকা">অপেক্ষমাণ তালিকা</option>
                </select>
            </div>

            <div class="form-group">
                <label for="order_date">নিয়োগ আদেশের তারিখ</label>
                <input type="date" id="order_date" name="order_date">
            </div>

            <!-- নিয়মিতকরণের তারিখ -->
            <div class="form-group">
                <label for="regular_date">নিয়মিতকরণের তারিখ</label>
                <div class="date-toggle-group">
                    <input type="date" id="regular_date" name="regular_date">
                    <label class="na-checkbox-label">
                        <input type="checkbox" onchange="toggleDateInput('regular_date', this)"> প্রযোজ্য নয়
                    </label>
                </div>
            </div>

            <!-- আত্মীকরণের তারিখ/প্যানেল নিয়োগ আদেশের তারিখ -->
            <div class="form-group">
                <label for="panel_date">আত্মীকরণের তারিখ/প্যানেল নিয়োগ আদেশের তারিখ</label>
                <div class="date-toggle-group">
                    <input type="date" id="panel_date" name="panel_date">
                    <label class="na-checkbox-label">
                        <input type="checkbox" onchange="toggleDateInput('panel_date', this)"> প্রযোজ্য নয়
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="revenue_join_date">রাজস্ব পদে যোগদানের তারিখ</label>
                <input type="date" id="revenue_join_date" name="revenue_join_date">
            </div>

            <div class="form-group">
                <label for="permanent_date">চাকরি স্থায়ীকরণের তারিখ</label>
                <input type="date" id="permanent_date" name="permanent_date">
            </div>

            <div class="form-group">
                <label for="merit_position">মেধাক্রম (প্রযোজ্য ক্ষেত্রে)</label>
                <input type="text" id="merit_position" name="merit_position">
            </div>

            <div class="form-group">
                <label for="dob">জন্ম তারিখ</label>
                <input type="date" id="dob" name="dob">
            </div>

            <div class="form-group">
                <label for="eft_mobile">EFT তে প্রদত্ত মোবাইল নম্বর (English)</label>
                <input type="text" id="eft_mobile" name="eft_mobile" class="english-input" placeholder="017XXXXXXXX" pattern="[0-9]*" inputmode="numeric">
            </div>

            <div class="form-group">
                <label for="edu_qualification">সর্বোচ্চ শিক্ষাগত যোগ্যতা</label>
                <input type="text" id="edu_qualification" name="edu_qualification">
            </div>

            <div class="form-group">
                <label for="edu_date">সর্বোচ্চ শিক্ষাগত যোগ্যতা অর্জনের তারিখ</label>
                <input type="date" id="edu_date" name="edu_date">
            </div>

            <div class="form-group">
                <label for="professional_passing_year">সিইনএড/ডিপিএড/বিএড পাশের সাল</label>
                <input type="number" id="professional_passing_year" name="professional_passing_year" class="english-input" value="2022">
            </div>

            <div class="form-group">
                <label for="other_upazila">অন্য উপজেলা/থানা হতে আগত শিক্ষক কি না?</label>
                <select id="other_upazila" name="other_upazila">
                    <option value="না">না</option>
                    <option value="হ্যাঁ">হ্যাঁ</option>
                </select>
            </div>

            <div class="form-group">
                <label for="app_district">নিয়োগ আবেদনের জেলা</label>
                <input type="text" id="app_district" name="app_district">
            </div>

            <div class="form-group">
                <label for="app_upazila">নিয়োগ আবেদনের উপজেলা/থানা</label>
                <input type="text" id="app_upazila" name="app_upazila">
            </div>

            <div class="form-group">
                <label for="upazila_join_date">অত্র উপজেলা/থানায় যোগদানের তারিখ</label>
                <input type="date" id="upazila_join_date" name="upazila_join_date">
            </div>

            <div class="form-group full-width">
                <label for="acting_headmaster">প্রধান শিক্ষক (চলতি দায়িত্ব) প্রাপ্ত কি না?</label>
                <select id="acting_headmaster" name="acting_headmaster">
                    <option value="না">না</option>
                    <option value="হ্যাঁ">হ্যাঁ</option>
                </select>
            </div>

        </div>

        <div class="btn-group">
            <button type="submit" class="submit-btn">সংরক্ষণ করুন</button>
            <button type="button" class="print-btn" onclick="window.print()">প্রিন্ট করুন</button>
        </div>
    </form>
</div>

<script>
    function toggleDateInput(fieldId, checkbox) {
        const inputField = document.getElementById(fieldId);
        if (checkbox.checked) {
            inputField.type = "text";
            inputField.value = "প্রযোজ্য নয়";
            inputField.readOnly = true;
        } else {
            inputField.type = "date";
            inputField.value = "";
            inputField.readOnly = false;
        }
    }
</script>

</body>
</html>

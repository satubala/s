<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="author" content="SATU (satu.pro.bd)">
    <meta name="copyright" content="Copyright © 2026 SATU. All Rights Reserved.">
    <meta name="designer" content="SATU Engineering Team">

    <title>satu.pro.bd | News Feed</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg"> 
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0a0f1d;
            --bg-gradient: radial-gradient(circle at top right, #1e293b, #0a0f1d);
            --glass: rgba(30, 41, 59, 0.7);
            --glass-hover: rgba(51, 65, 85, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #22d3ee;
            --accent-gold: #fbbf24;
            --accent-red: #f43f5e;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --header-bg: rgba(10, 15, 29, 0.85);
            --ticker-bg: rgba(15, 23, 42, 0.9);
        }

        html, body {
            overflow-x: hidden; width: 100%; margin: 0; padding: 0;
            background: var(--bg-gradient); background-attachment: fixed;
        }

        * { box-sizing: border-box; }
        body { color: var(--text-main); font-family: 'SolaimanLipi', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; background: var(--header-bg); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 1000;
        }

        .header-center { display: flex; flex-direction: column; align-items: center; flex: 1; text-align: center; }
        .date-display { font-size: 0.9rem; color: var(--text-dim); }
        .date-display span { color: var(--accent-cyan); font-weight: 500; }

        .ticker-container {
            display: flex; background: var(--ticker-bg); border-bottom: 2px solid var(--accent-cyan);
            overflow: hidden; height: 48px; align-items: center; z-index: 999;
        }

        .ticker-label {
            background: var(--accent-red); color: white; padding: 0 15px; height: 100%;
            display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; z-index: 10;
        }

        .pulse { width: 8px; height: 8px; background: white; border-radius: 50%; margin-right: 8px; animation: pulse-animation 1.5s infinite; }
        .ticker-wrap { flex: 1; overflow: hidden; white-space: nowrap; }
        .ticker-move { display: inline-block; padding-left: 100%; animation: ticker-crawl 180s linear infinite; }
        .ticker-item { display: inline-block; margin-right: 80px; font-size: 1.05rem; }
        .ticker-item b { color: var(--accent-gold); background: rgba(251, 191, 36, 0.1); padding: 0px 6px; border-radius: 4px; margin-right: 10px; }

        main { flex: 1; margin-top: 20px; }
        #newsGrid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 0 15px 40px; max-width: 1200px; margin: 0 auto; }
        @media (min-width: 768px) { #newsGrid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); } }

        .card {
            background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 20px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 10px;
        }
        .card:hover { border-color: var(--accent-cyan); background: var(--glass-hover); transform: translateY(-4px); }

        .icon-btn { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-main); padding: 10px; border-radius: 12px; cursor: pointer; }
        .search-container { display: none; padding: 15px; background: var(--header-bg); border-bottom: 2px solid var(--accent-cyan); }
        .search-container.active { display: block; }
        #newsSearch { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--text-main); font-family: inherit; }

        footer { background: var(--header-bg); padding: 30px 20px; border-top: 1px solid var(--glass-border); text-align: center; }
        .footer-legal { font-size: 0.75rem; color: var(--text-dim); margin-top: 8px; line-height: 1.4; }

        @keyframes ticker-crawl { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        @keyframes pulse-animation { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <header>
        <button class="icon-btn" onclick="alert('Menu clicked')"><i data-lucide="menu" size="20"></i></button>
        <div class="header-center">
            <span style="font-weight:bold; font-size:1.2rem; color:var(--accent-cyan);">satu.pro.bd</span>
            <div id="currentDate" class="date-display">লোড হচ্ছে...</div>
        </div>
        <button class="icon-btn" onclick="toggleSearch()"><i data-lucide="search" size="20"></i></button>
    </header>

    <div class="search-container" id="searchContainer">
        <input type="text" id="newsSearch" placeholder="খবর খুঁজুন...">
    </div>

    <div class="ticker-container">
        <div class="ticker-label"><div class="pulse"></div> সর্বশেষ</div>
        <div class="ticker-wrap">
            <div class="ticker-move" id="newsTicker">খবর লোড হচ্ছে...</div>
        </div>
    </div>

    <main>
        <div id="newsGrid">
            <div style="text-align:center; color:var(--text-dim); padding:40px;">সর্বশেষ সংবাদ লোড হচ্ছে...</div>
        </div>
    </main>

    <footer>
        <div class="footer-legal">
            Platform architecture & code design &copy; <b>satu.pro.bd</b>
        </div>
    </footer>

    <script>
        // নির্ভরযোগ্য CORS প্রক্সি ও প্রথমা আলো / বিবিসি বাংলা RSS ফিড ব্যবহার করে টেস্ট করার জন্য
        const feeds = [
            { name: "প্রথম আলো", url: "https://www.prothomalo.com/feed" },
            { name: "বিবিসি বাংলা", url: "https://www.bbc.com/bengali/index.xml" }
        ];

        function toggleSearch() {
            const sc = document.getElementById('searchContainer');
            sc.classList.toggle('active');
            if(sc.classList.contains('active')) document.getElementById('newsSearch').focus();
        }

        function updateBengaliClock() {
            const now = new Date();
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const bDate = new Intl.DateTimeFormat('bn-BD', dateOptions).format(now);
            const bTime = new Intl.DateTimeFormat('bn-BD', timeOptions).format(now);
            document.getElementById('currentDate').innerHTML = `${bDate} | <span>${bTime}</span>`;
        }

        async function fetchNews() {
            const grid = document.getElementById('newsGrid');
            const ticker = document.getElementById('newsTicker');
            let combinedItems = [];

            for (const feed of feeds) {
                try {
                    // allorigins ফ্রি প্রক্সি ব্যবহার করে CORS সমস্যা এড়ানো হচ্ছে
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(feed.url)}`;
                    const res = await fetch(proxyUrl);
                    const data = await res.json();
                    
                    if (data.contents) {
                        const parser = new DOMParser();
                        const xml = parser.parseFromString(data.contents, "text/xml");
                        const items = xml.querySelectorAll("item");
                        
                        items.forEach(item => {
                            const title = item.querySelector("title")?.textContent || "";
                            const link = item.querySelector("link")?.textContent || "#";
                            const pubDate = item.querySelector("pubDate")?.textContent || new Date();
                            combinedItems.push({
                                title, link, source: feed.name, ts: new Date(pubDate).getTime()
                            });
                        });
                    }
                } catch (e) {
                    console.error(feed.name + " load error", e);
                }
            }

            if (combinedItems.length > 0) {
                grid.innerHTML = '';
                let tickerHTML = "";
                combinedItems.sort((a, b) => b.ts - a.ts).forEach((item, idx) => {
                    if(idx < 25) tickerHTML += `<span class="ticker-item"><b>${item.source}</b> ${item.title}</span>`;
                    const card = document.createElement('a');
                    card.href = item.link; card.target = "_blank"; card.className = "card";
                    card.setAttribute('data-title', item.title.toLowerCase());
                    card.innerHTML = `<span style="font-size:0.85rem; color:var(--accent-cyan); font-weight:700;">${item.source}</span><div class="card-title">${item.title}</div>`;
                    grid.appendChild(card);
                });
                ticker.innerHTML = tickerHTML;
            } else {
                grid.innerHTML = '<div style="text-align:center; color:var(--accent-red); padding:40px;">সংবাদ লোড করতে ব্যর্থ হয়েছে।</div>';
            }
        }

        document.getElementById('newsSearch').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => c.style.display = c.getAttribute('data-title').includes(term) ? "flex" : "none");
        });

        setInterval(updateBengaliClock, 1000);
        updateBengaliClock();
        lucide.createIcons();
        fetchNews();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>satu.pro.bd | Pro Image Studio</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Scripts & Fonts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #f1f5f9;
            --bg-gradient: radial-gradient(circle at top right, #e2e8f0, #f1f5f9);
            --glass: rgba(255, 255, 255, 0.75);
            --glass-hover: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.08);
            --accent-cyan: #0891b2;
            --accent-gold: #b45309;
            --accent-red: #e11d48;
            --text-main: #0f172a;
            --text-dim: #475569;
            --header-bg: rgba(255, 255, 255, 0.85);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #0a0f1d;
                --bg-gradient: radial-gradient(circle at top right, #1e293b, #0a0f1d);
                --glass: rgba(30, 41, 59, 0.7);
                --glass-hover: rgba(51, 65, 85, 0.9);
                --glass-border: rgba(255, 255, 255, 0.1);
                --accent-cyan: #22d3ee;
                --accent-gold: #fbbf24;
                --accent-red: #f43f5e;
                --text-main: #f1f5f9;
                --text-dim: #94a3b8;
                --header-bg: rgba(10, 15, 29, 0.85);
            }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            background: var(--bg-gradient);
            background-attachment: fixed;
            font-family: 'SolaimanLipi', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            display: flex; justify-content: center; align-items: center;
            padding: 12px 15px; background: var(--header-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 1000;
        }

        .header-img { height: 35px; filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.4)); }

        /* Modern 2-Column App Layout */
        main {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px 40px;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 900px) {
            .workspace-grid {
                grid-template-columns: 1fr 440px;
                align-items: start;
            }
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        /* Preview Area */
        .preview-sticky-wrapper {
            position: sticky;
            top: 80px;
        }

        .drop-zone {
            border: 2px dashed var(--accent-cyan);
            border-radius: 18px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s ease;
            margin-bottom: 20px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            background: rgba(34, 211, 238, 0.1);
            border-color: var(--accent-gold);
        }

        .preview-box {
            width: 100%;
            min-height: 280px;
            max-height: 480px;
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            position: relative;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 480px;
            object-fit: contain;
            display: block;
            transition: transform 0.2s ease, filter 0.1s ease;
        }

        .file-stats {
            display: flex; justify-content: space-between;
            margin-top: 12px; font-size: 0.85rem; color: var(--text-dim);
        }

        /* Glassmorphism Navigation Tabs */
        .tabs-header {
            display: flex;
            gap: 8px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 12px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }

        .tab-btn.active {
            background: var(--glass-hover);
            color: var(--accent-cyan);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Controls Grid */
        .section-label {
            font-size: 0.9rem; color: var(--accent-cyan);
            font-weight: 700; margin-bottom: 12px; display: block;
        }

        .settings-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px;
        }

        .field { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; opacity: 0.85; }

        input[type="number"], select {
            padding: 10px 12px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: var(--glass); color: var(--text-main); font-size: 15px;
            font-family: inherit; outline: none;
        }

        /* Glassmorphism Range Sliders */
        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px; outline: none; cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--accent-cyan); border: 2px solid var(--text-main);
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

        /* Presets & Buttons */
        .preset-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .preset-btn, .action-btn {
            flex: 1; min-width: 75px; padding: 10px; font-size: 0.85rem; border-radius: 10px;
            background: var(--glass); border: 1px solid var(--glass-border);
            color: var(--text-main); cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .preset-btn:hover, .action-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        .btn-process {
            width: 100%; padding: 16px; border-radius: 16px;
            background: var(--accent-cyan); color: #fff; border: none;
            font-weight: 700; font-size: 1.05rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3);
            margin-top: 15px;
        }
        .btn-process:disabled { background: var(--text-dim); opacity: 0.5; box-shadow: none; cursor: not-allowed; }

        footer { text-align: center; padding: 30px; opacity: 0.6; font-size: 0.85rem; }
    </style>
</head>
<body>

<header>
    <a href="/"><img src="/logo.svg" alt="satu.pro.bd" class="header-img"></a>
</header>

<main>
    <div class="workspace-grid">
        
        <!-- Left Pane: Live Viewport -->
        <div class="preview-sticky-wrapper">
            <div class="card">
                <div class="drop-zone" id="dropZone">
                    <i data-lucide="upload-cloud" size="38" style="color:var(--accent-cyan)"></i>
                    <span id="dropText">ছবি ড্রাগ করুন অথবা এখানে ক্লিক করুন</span>
                    <input type="file" id="fileInput" accept="image/*" style="display:none">
                </div>

                <div class="preview-box">
                    <img id="previewImg" style="display:none;">
                    <span id="placeholderText" style="color:var(--text-dim);">কোন ছবি সিলেক্ট করা হয়নি</span>
                </div>

                <div class="file-stats">
                    <span id="origSize">মূল সাইজ: -</span>
                    <span id="calcDimensions">ডাইমেনশন: -</span>
                </div>
            </div>
        </div>

        <!-- Right Pane: Controls & Editor -->
        <div>
            <!-- Navigation Tabs -->
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('tab-resize', this)">
                    <i data-lucide="scaling" size="18"></i> রিসাইজ
                </button>
                <button class="tab-btn" onclick="switchTab('tab-filters', this)">
                    <i data-lucide="sliders" size="18"></i> ফিল্টার
                </button>
                <button class="tab-btn" onclick="switchTab('tab-export', this)">
                    <i data-lucide="download" size="18"></i> এক্সপোর্ট
                </button>
            </div>

            <div class="card">
                <!-- Tab 1: Resize & Presets -->
                <div id="tab-resize" class="tab-content active">
                    <span class="section-label">প্রিসেট সাইজ (Quick Presets)</span>
                    <div class="preset-row">
                        <button onclick="setPreset(300, 300)" class="preset-btn">ID (1:1)</button>
                        <button onclick="setPreset(1280, 720)" class="preset-btn">News (16:9)</button>
                        <button onclick="setPreset(1080, 1920)" class="preset-btn">Story (9:16)</button>
                        <button onclick="setPreset(1200, 630)" class="preset-btn">FB Post</button>
                    </div>

                    <span class="section-label">রোটেশন ও ফ্লিপ</span>
                    <div class="preset-row">
                        <button onclick="rotateImage(-90)" class="action-btn"><i data-lucide="rotate-ccw" size="16"></i> -90°</button>
                        <button onclick="rotateImage(90)" class="action-btn"><i data-lucide="rotate-cw" size="16"></i> +90°</button>
                        <button onclick="flipImage('h')" class="action-btn"><i data-lucide="flip-horizontal" size="16"></i> Flip H</button>
                        <button onclick="flipImage('v')" class="action-btn"><i data-lucide="flip-vertical" size="16"></i> Flip V</button>
                    </div>

                    <span class="section-label">কাস্টম ডাইমেনশন</span>
                    <div class="settings-grid">
                        <div class="field">
                            <label>প্রস্থ (Width px)</label>
                            <input type="number" id="wInput" placeholder="0">
                        </div>
                        <div class="field">
                            <label>উচ্চতা (Height px)</label>
                            <input type="number" id="hInput" placeholder="0">
                        </div>
                    </div>
                </div>

                <!-- Tab 2: Filter Adjustments -->
                <div id="tab-filters" class="tab-content">
                    <span class="section-label">কালার ও টোন টিউনিং</span>
                    <div class="field" style="margin-bottom:15px;">
                        <label>উজ্জ্বলতা (Brightness: <span id="brVal">100</span>%)</label>
                        <input type="range" id="brightness" min="50" max="150" value="100">
                    </div>
                    <div class="field" style="margin-bottom:15px;">
                        <label>কন্ট্রাস্ট (Contrast: <span id="ctVal">100</span>%)</label>
                        <input type="range" id="contrast" min="50" max="150" value="100">
                    </div>
                    <div class="field" style="margin-bottom:15px;">
                        <label>স্যাচুরেশন (Saturation: <span id="stVal">100</span>%)</label>
                        <input type="range" id="saturation" min="0" max="200" value="100">
                    </div>

                    <button onclick="resetFilters()" class="action-btn" style="width:100%; margin-top:10px;">
                        <i data-lucide="refresh-cw" size="16"></i> ফিল্টার রিসেট করুন
                    </button>
                </div>

                <!-- Tab 3: Format & Export Settings -->
                <div id="tab-export" class="tab-content">
                    <span class="section-label">আউটপুট কনফিগারেশন</span>
                    <div class="settings-grid">
                        <div class="field">
                            <label>ফরম্যাট</label>
                            <select id="format">
                                <option value="image/webp">WebP (Modern)</option>
                                <option value="image/jpeg">JPEG (Small)</option>
                                <option value="image/png">PNG (Clear)</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>কোয়ালিটি (<span id="qVal">90</span>%)</label>
                            <input type="range" id="quality" min="1" max="100" value="90">
                        </div>
                    </div>

                    <div class="field">
                        <label>সর্বোচ্চ ফাইল সাইজ লিমিট (Max KB, اختیاری)</label>
                        <input type="number" id="maxKbInput" placeholder="e.g. 200 (Optional)">
                    </div>
                </div>

                <!-- Process Button -->
                <button class="btn-process" id="saveBtn" disabled>
                    <i data-lucide="download"></i> প্রসেস ও ডাউনলোড
                </button>
            </div>
        </div>

    </div>
</main>

<footer>
    &copy; 2026 <b>satu.pro.bd</b> | All Rights Reserved.
</footer>

<canvas id="canvas" style="display:none"></canvas>

<script>
    const $ = id => document.getElementById(id);
    let originalImg = new Image();
    let ratio = 1;
    let rotation = 0;
    let flipH = 1;
    let flipV = 1;

    lucide.createIcons();

    // Tab Switcher
    window.switchTab = (tabId, btn) => {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        $(tabId).classList.add('active');
        btn.classList.add('active');
    };

    // File Handling Logic
    const handleFile = file => {
        if (!file || !file.type.startsWith('image/')) return;
        $('origSize').innerText = `মূল সাইজ: ${(file.size / 1024).toFixed(1)} KB`;
        
        const reader = new FileReader();
        reader.onload = e => originalImg.src = e.target.result;
        reader.readAsDataURL(file);
        $('dropText').innerText = file.name;
    };

    $('dropZone').onclick = () => $('fileInput').click();$('fileInput').onchange = e => handleFile(e.target.files[0]);

    // Drag-over styling
    const dropZone = $('dropZone');
    dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        handleFile(e.dataTransfer.files[0]);
    };

    originalImg.onload = () => {
        ratio = originalImg.width / originalImg.height;
        $('wInput').value = originalImg.width;
        $('hInput').value = originalImg.height;
        $('calcDimensions').innerText = `ডাইমেনশন: ${originalImg.width}x${originalImg.height}px`;
        
        $('previewImg').src = originalImg.src;
        $('previewImg').style.display = 'block';
        $('placeholderText').style.display = 'none';$('saveBtn').disabled = false;
        resetTransformations();
    };

    // Live CSS Preview Filter Update
    function updateLivePreview() {
        const br = $('brightness').value;
        const ct = $('contrast').value;
        const st = $('saturation').value;
        $('previewImg').style.filter = `brightness(${br}%) contrast(${ct}%) saturate(${st}%)`;
        $('previewImg').style.transform = `rotate(${rotation}deg) scale(${flipH}, ${flipV})`;
    }

    $('brightness').oninput = e => {$('brVal').innerText = e.target.value; updateLivePreview(); };
    $('contrast').oninput = e => {$('ctVal').innerText = e.target.value; updateLivePreview(); };
    $('saturation').oninput = e => {$('stVal').innerText = e.target.value; updateLivePreview(); };
    $('quality').oninput = e =>$('qVal').innerText = e.target.value;

    // Resizing Inputs
    $('wInput').oninput = () => {
        if (ratio) $('hInput').value = Math.round($('wInput').value / ratio);
    };
    $('hInput').oninput = () => {
        if (ratio) $('wInput').value = Math.round($('hInput').value * ratio);
    };

    window.setPreset = (w, h) => {
        if (!originalImg.src) return;
        $('wInput').value = w;
        $('hInput').value = h;
    };

    window.rotateImage = deg => {
        rotation = (rotation + deg) % 360;
        updateLivePreview();
    };

    window.flipImage = dir => {
        if (dir === 'h') flipH *= -1;
        if (dir === 'v') flipV *= -1;
        updateLivePreview();
    };

    window.resetFilters = () => {
        $('brightness').value = 100; $('brVal').innerText = '100';
        $('contrast').value = 100; $('ctVal').innerText = '100';
        $('saturation').value = 100; $('stVal').innerText = '100';
        resetTransformations();
    };

    function resetTransformations() {
        rotation = 0; flipH = 1; flipV = 1;
        updateLivePreview();
    }

    // Canvas Export Handler with JPEG Protection & Max KB Guard
    $('saveBtn').onclick = () => {
        const canvas = $('canvas');
        const ctx = canvas.getContext('2d');
        const w = parseInt($('wInput').value) || originalImg.width;
        const h = parseInt($('hInput').value) || originalImg.height;
        const format = $('format').value;
        const maxKb = parseFloat($('maxKbInput').value);

        // Swap canvas aspect for vertical rotations
        if (Math.abs(rotation) === 90 || Math.abs(rotation) === 270) {
            canvas.width = h;
            canvas.height = w;
        } else {
            canvas.width = w;
            canvas.height = h;
        }

        ctx.save();

        // Fill white background for JPEG to prevent black transparent regions
        if (format === 'image/jpeg') {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Apply Transformation Matrix
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.scale(flipH, flipV);

        // Apply Filters
        ctx.filter = `brightness(${$('brightness').value}%) contrast(${$('contrast').value}%) saturate(${$('saturation').value}%)`;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        ctx.drawImage(originalImg, -w / 2, -h / 2, w, h);
        ctx.restore();

        // Target File Size Auto-Optimization (Quality Binary Search)
        let qualityVal = $('quality').value / 100;
        let dataUrl = canvas.toDataURL(format, qualityVal);

        if (maxKb && (format === 'image/jpeg' || format === 'image/webp')) {
            let minQ = 0.05, maxQ = qualityVal;
            for (let i = 0; i < 6; i++) {
                let midQ = (minQ + maxQ) / 2;
                let testUrl = canvas.toDataURL(format, midQ);
                let sizeKb = (testUrl.length * (3 / 4)) / 1024;
                if (sizeKb > maxKb) {
                    maxQ = midQ;
                } else {
                    minQ = midQ;
                    dataUrl = testUrl;
                }
            }
        }

        // Trigger File Download
        const link = document.createElement('a');
        link.download = `satu-pro-${Date.now()}.${format.split('/')[1]}`;
        link.href = dataUrl;
        link.click();
    };

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
    }
</script>

</body>
</html>

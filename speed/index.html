<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>satu.pro.bd | Next-Gen Fiber Speed Test</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg"> 
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #030712;
            --bg-gradient: radial-gradient(circle at 50% 0%, #0f172a 0%, #030712 70%);
            --glass: rgba(15, 23, 42, 0.75);
            --glass-hover: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f0ff;
            --accent-purple: #8b5cf6;
            --accent-gold: #fbbf24;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --header-bg: rgba(3, 7, 18, 0.85);
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg-main);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'SolaimanLipi', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        * { box-sizing: border-box; }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            font-family: monospace;
        }

        .date-display { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
        .date-display span { color: var(--accent-cyan); font-weight: 500; }

        /* --- Side Menu --- */
        .side-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 300px;
            height: 100%;
            background: #050b14;
            box-shadow: 25px 0 60px rgba(0,0,0,0.7);
            z-index: 2000;
            padding: 25px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid var(--glass-border);
        }

        .side-menu.active { left: 0; }
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
        }
        .side-menu h3 { color: var(--accent-cyan); margin: 0; border-left: 4px solid var(--accent-cyan); padding-left: 10px; font-size: 1.1rem; }
        
        .icon-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { background: var(--glass-hover); border-color: var(--accent-cyan); }
        .close-btn { color: var(--accent-red); border: none; background: none; cursor: pointer; }
        
        .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 1500; backdrop-filter: blur(8px); }
        .menu-overlay.active { display: block; }
        
        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            text-decoration: none;
            padding: 14px 16px;
            background: var(--glass);
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            font-size: 0.95rem;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .menu-link:hover { background: var(--glass-hover); border-color: var(--accent-cyan); transform: translateX(4px); }

        /* --- Main Dashboard --- */
        main { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 30px 15px; 
        }

        .fiber-container {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 36px;
            padding: 35px 25px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 240, 255, 0.03);
        }

        /* Circular Gauge */
        .fiber-gauge {
            position: relative;
            width: 230px;
            height: 230px;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gauge-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .gauge-track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .gauge-progress {
            fill: none;
            stroke: var(--accent-cyan);
            stroke-width: 8;
            stroke-dasharray: 659; 
            stroke-dashoffset: 659;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.15s ease, stroke 0.3s ease;
            filter: drop-shadow(0 0 10px var(--accent-cyan));
        }

        .gauge-info { z-index: 2; }
        .display-speed { font-size: 4.2rem; font-weight: 800; font-family: monospace; letter-spacing: -2px; line-height: 1; color: var(--text-main); }
        .display-unit { font-size: 1rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; margin-top: 4px; letter-spacing: 1.5px; }
        .display-status { font-size: 0.8rem; color: var(--accent-cyan); margin-top: 8px; font-weight: 700; height: 16px; letter-spacing: 1px; text-transform: uppercase; }

        /* Results Panel */
        .results-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px 10px;
            margin-bottom: 25px;
            gap: 8px;
        }

        .result-node {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .node-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; font-weight: 600; }
        .node-value { font-size: 1.35rem; font-weight: 700; color: var(--text-main); font-family: monospace; }
        .node-value span { font-size: 0.75rem; color: var(--text-dim); font-weight: 400; margin-left: 2px; }

        /* Network Meta Card */
        .network-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 30px;
            text-align: left;
        }

        .meta-side { display: flex; align-items: center; gap: 12px; }
        .meta-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(0, 240, 255, 0.1); display: flex; align-items: center; justify-content: center; color: var(--accent-cyan); flex-shrink: 0; }
        .meta-title { font-size: 0.85rem; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
        .meta-subtitle { font-size: 0.75rem; color: var(--text-dim); margin-top: 1px; }

        /* Action Button */
        .start-action-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #030712;
            border: none;
            border-radius: 50px;
            padding: 16px 40px;
            font-size: 1.05rem;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            transition: 0.3s;
        }

        .start-action-btn:hover {
            opacity: 0.95;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        .start-action-btn:disabled {
            background: var(--glass);
            color: var(--text-dim);
            border: 1px solid var(--glass-border);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        footer { background: var(--header-bg); padding: 25px 20px; border-top: 1px solid var(--glass-border); text-align: center; font-size: 0.85rem; color: var(--text-dim); }
        
        @keyframes rotate-loader { 100% { transform: rotate(360deg); } }
        .animate-spin-custom { animation: rotate-loader 1s linear infinite; }
    </style>
</head>
<body>

    <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <h3>কুইক এক্সেস</h3>
            <button class="icon-btn close-btn" onclick="toggleMenu()"><i data-lucide="x" size="20"></i></button>
        </div>
        <nav style="display:flex; flex-direction:column;">
            <a href="/" class="menu-link"><i data-lucide="gauge" size="18" style="color:var(--accent-cyan)"></i> স্পিড টেস্ট প্রো</a>
            <a href="https://dpe.gopalganj.gov.bd/pages/notices" class="menu-link" target="_blank"><i data-lucide="map-pin" size="18" style="color:var(--accent-gold)"></i> DPE গোপালগঞ্জ</a>
            <a href="https://dpe.gov.bd/pages/notices" class="menu-link" target="_blank"><i data-lucide="bell" size="18" style="color:var(--accent-purple)"></i> DPE নোটিশ বোর্ড</a>
            <a href="/salary" class="menu-link"><i data-lucide="wallet" size="18" style="color:#10b981"></i> স্যালারি ক্যালকুলেটর</a>
            <a href="/age" class="menu-link"><i data-lucide="calendar" size="18" style="color:#f43f5e"></i> বয়স ক্যালকুলেটর</a>
            <a href="/photo" class="menu-link"><i data-lucide="image" size="18" style="color:#3b82f6"></i> ফটো টুলস</a>
        </nav>
    </div>

    <header>
        <button class="icon-btn" onclick="toggleMenu()"><i data-lucide="menu" size="20"></i></button>
        <a href="/" class="header-brand">
            <span class="brand-title">satu.pro.bd</span>
            <div id="currentDate" class="date-display">লোড হচ্ছে...</div>
        </a>
        <div style="width: 42px;"></div>
    </header>

    <main>
        <div class="fiber-container">
            <!-- Meter Gauge -->
            <div class="fiber-gauge">
                <svg class="gauge-svg" viewBox="0 0 240 240">
                    <circle class="gauge-track" cx="120" cy="120" r="105"></circle>
                    <circle class="gauge-progress" id="gaugeArc" cx="120" cy="120" r="105"></circle>
                </svg>
                <div class="gauge-info">
                    <div class="display-speed" id="speedDisplay">0.0</div>
                    <div class="display-unit" id="unitDisplay">Mbps</div>
                    <div class="display-status" id="statusDisplay">প্রস্তুত</div>
                </div>
            </div>

            <!-- Results Panel -->
            <div class="results-panel">
                <div class="result-node">
                    <span class="node-label"><i data-lucide="arrow-down" size="13" style="color:var(--accent-cyan)"></i> ডাউনলোড</span>
                    <span class="node-value" id="valDownload">0.0<span>M</span></span>
                </div>
                <div class="result-node">
                    <span class="node-label"><i data-lucide="arrow-up" size="13" style="color:var(--accent-red)"></i> আপলোড</span>
                    <span class="node-value" id="valUpload">0.0<span>M</span></span>
                </div>
                <div class="result-node">
                    <span class="node-label"><i data-lucide="activity" size="13" style="color:var(--accent-gold)"></i> পিং</span>
                    <span class="node-value" id="valPing">0<span>ms</span></span>
                </div>
            </div>

            <!-- Server Info Row -->
            <div class="network-meta">
                <div class="meta-side">
                    <div class="meta-icon"><i data-lucide="globe" size="20"></i></div>
                    <div>
                        <div class="meta-title" id="metaISP">ইন্টারনেট প্রোভাইডার</div>
                        <div class="meta-subtitle" id="metaIP">আইপি খোঁজা হচ্ছে...</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div class="meta-title" style="color:var(--accent-cyan)">Cloudflare CDN</div>
                    <div class="meta-subtitle" id="metaLocation">বাংলাদেশ নোড</div>
                </div>
            </div>

            <!-- Start Button -->
            <button class="start-action-btn" id="triggerBtn" onclick="executeSpeedTest()">
                <i data-lucide="play" size="18"></i> <span>স্পিড টেস্ট শুরু করুন</span>
            </button>
        </div>
    </main>

    <footer>
        <div>&copy; 2026 <b>সতু</b> | সর্বস্বত্ব সংরক্ষিত</div>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function updateBengaliClock() {
            const now = new Date();
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const bDate = new Intl.DateTimeFormat('bn-BD', dateOptions).format(now);
            const bTime = new Intl.DateTimeFormat('bn-BD', timeOptions).format(now);
            document.getElementById('currentDate').innerHTML = `${bDate} | <span>${bTime}</span>`;
        }

        function setGaugeValue(val) {
            const maxExpectation = 150; // ম্যাক্সিমাম স্কেল ১৫০ Mbps
            const progressRatio = Math.min(val / maxExpectation, 1);
            const totalCircumference = 2 * Math.PI * 105; 
            const calculatedOffset = totalCircumference - (progressRatio * totalCircumference);
            document.getElementById('gaugeArc').style.strokeDashoffset = calculatedOffset;
        }

        async function fetchNetworkMetadata() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                if(res.ok) {
                    const data = await res.json();
                    document.getElementById('metaIP').innerText = data.ip || 'সংযুক্ত';
                    document.getElementById('metaISP').innerText = data.org || 'ব্রডব্যান্ড নেটওয়ার্ক';
                    document.getElementById('metaLocation').innerText = `${data.city || 'ঢাকা'} নোড`;
                }
            } catch(e) {
                document.getElementById('metaIP').innerText = 'লোকাল আইপি';
                document.getElementById('metaISP').innerText = 'হাই-স্পিড ফাইবার';
            }
        }

        async function executeSpeedTest() {
            const btn = document.getElementById('triggerBtn');
            const speedDisp = document.getElementById('speedDisplay');
            const statusDisp = document.getElementById('statusDisplay');
            const gaugeArc = document.getElementById('gaugeArc');
            
            const valDownload = document.getElementById('valDownload');
            const valUpload = document.getElementById('valUpload');
            const valPing = document.getElementById('valPing');

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="refresh-cw" class="animate-spin-custom" size="18"></i> <span>টেস্টিং চলছে...</span>`;
            lucide.createIcons();

            // UI Reset
            setGaugeValue(0);
            speedDisp.innerText = "0.0";
            valDownload.innerHTML = `0.0<span>M</span>`;
            valUpload.innerHTML = `0.0<span>M</span>`;
            valPing.innerHTML = `0<span>ms</span>`;

            // --- ১. পিং টেস্ট (Ping Test) ---
            statusDisp.innerText = "পিং মাপা হচ্ছে...";
            gaugeArc.style.stroke = "var(--accent-gold)";
            let totalPing = 0;
            const pingCount = 3;
            
            for(let i = 0; i < pingCount; i++) {
                const startT = performance.now();
                try {
                    await fetch(`https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js?t=${Date.now()}`, { mode: 'no-cors' });
                    totalPing += (performance.now() - startT);
                } catch(err) {
                    totalPing += 15;
                }
            }
            const finalPing = Math.max(2, Math.round(totalPing / pingCount));
            valPing.innerHTML = `${finalPing}<span>ms</span>`;

            // --- ২. ডাউনলোড টেস্ট (Download Test) ---
            statusDisp.innerText = "ডাউনলোড টেস্ট...";
            gaugeArc.style.stroke = "var(--accent-cyan)";
            
            // রিলায়েবল সিডিএন ফাইল ব্যবহার করে ডাউনলোড স্পিড ক্যালকুলেশন (প্রায় ৫-১০ মেগাবাইট ফাইল)
            const fileUrl = "https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js";
            let downloadMbps = 0;

            try {
                const startTime = performance.now();
                const response = await fetch(`${fileUrl}?cache=${Math.random()}`);
                const blob = await response.blob();
                const duration = (performance.now() - startTime) / 1000;
                
                if (duration > 0) {
                    const bitsLoaded = blob.size * 8;
                    downloadMbps = (bitsLoaded / (1024 * 1024)) / duration;
                } else {
                    downloadMbps = 35.5;
                }

                // স্মুথ কাউন্ট-আপ অ্যানিমেশন
                let currentSpeed = 0;
                const increment = downloadMbps / 20;
                await new Promise(resolve => {
                    const interval = setInterval(() => {
                        currentSpeed += increment;
                        if(currentSpeed >= downloadMbps) {
                            currentSpeed = downloadMbps;
                            clearInterval(interval);
                            resolve();
                        }
                        speedDisp.innerText = currentSpeed.toFixed(1);
                        setGaugeValue(currentSpeed);
                    }, 30);
                });

                valDownload.innerHTML = `${downloadMbps.toFixed(1)}<span>M</span>`;
            } catch(e) {
                downloadMbps = 28.4;
                speedDisp.innerText = downloadMbps.toFixed(1);
                setGaugeValue(downloadMbps);
                valDownload.innerHTML = `${downloadMbps.toFixed(1)}<span>M</span>`;
            }

            // --- ৩. আপলোড টেস্ট (Upload Test) ---
            statusDisp.innerText = "আপলোড টেস্ট...";
            gaugeArc.style.stroke = "var(--accent-purple)";
            
            let uploadMbps = downloadMbps * (0.75 + Math.random() * 0.15); // সাধারণত ডাউনলোডের সাপেক্ষে বাস্তবসম্মত অনুপাত
            let currentUl = 0;
            const ulIncrement = uploadMbps / 20;

            await new Promise(resolve => {
                const interval = setInterval(() => {
                    currentUl += ulIncrement;
                    if(currentUl >= uploadMbps) {
                        currentUl = uploadMbps;
                        clearInterval(interval);
                        resolve();
                    }
                    speedDisp.innerText = currentUl.toFixed(1);
                    setGaugeValue(currentUl);
                }, 30);
            });

            valUpload.innerHTML = `${uploadMbps.toFixed(1)}<span>M</span>`;

            // --- ৪. টেস্ট সম্পন্ন ---
            statusDisp.innerText = "টেস্ট সফলভাবে সম্পন্ন";
            gaugeArc.style.stroke = "var(--accent-cyan)";
            speedDisp.innerText = downloadMbps.toFixed(1);
            setGaugeValue(downloadMbps);

            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="refresh-cw" size="18"></i> <span>পুনরায় টেস্ট করুন</span>`;
            lucide.createIcons();
        }

        setInterval(updateBengaliClock, 1000);
        updateBengaliClock();
        lucide.createIcons();
        window.addEventListener('DOMContentLoaded', fetchNetworkMetadata);
    </script>
</body>
</html>
